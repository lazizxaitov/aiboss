<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Business OS</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #1e1e21; color: #f4f7fb; }
      main { width: min(360px, calc(100vw - 48px)); padding: 34px 30px; border: 1px solid #3a3d43; border-radius: 26px; background: #2e3137; text-align: center; box-shadow: 0 22px 70px rgba(0,0,0,.3); }
      .mark { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center; background: #fff27a; color: #1e1e21; font-size: 27px; font-weight: 700; }
      h1 { margin: 0; font-size: 21px; letter-spacing: -.04em; }
      p { margin: 12px 0 0; color: #91a0b8; font-size: 14px; }
      .loader { width: 32px; height: 3px; margin: 22px auto 0; overflow: hidden; border-radius: 99px; background: #454952; }
      .loader::after { content: ""; display: block; width: 45%; height: 100%; border-radius: inherit; background: #fff27a; animation: loading 1.1s ease-in-out infinite; }
      @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(240%); } }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">AI</div>
      <h1>AI Business OS запускается...</h1>
      <p>Подключаем рабочие сервисы</p>
      <div class="loader" aria-hidden="true"></div>
    </main>
    <script>
      const services = [
        "http://127.0.0.1:8000/api/v1/health",
        "http://127.0.0.1:3000",
      ];
      async function reachable(url) {
        try {
          await fetch(url, { mode: "no-cors", cache: "no-store" });
          return true;
        } catch {
          return false;
        }
      }
      async function waitForServices() {
        const ready = await Promise.all(services.map(reachable));
        if (ready.every(Boolean)) {
          window.location.replace("http://127.0.0.1:3000");
          return;
        }
        window.setTimeout(waitForServices, 1500);
      }
      waitForServices();
    </script>
  </body>
</html>
