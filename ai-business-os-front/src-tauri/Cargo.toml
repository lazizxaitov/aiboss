[package]
name = "ai-business-os"
version = "0.1.0"
description = "AI Business OS desktop shell"
authors = ["AI Business OS"]
edition = "2021"

[lib]
name = "ai_business_os_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
